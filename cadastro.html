<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSPORTS</title>
    <link rel="stylesheet" href="CSS/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>
    <header class="cabecalho">


        <a href="#">
            <img src="logoIFsports.png" alt="Logo IFsports" height="70px" width="170px" class="logoIFsportsImg">
        </a>
    </header>

   
<div class="icone-voltar">
    <a href="login.htmlgit"><i class="fa-solid fa-circle-arrow-left fa-2xl" style="color: rgb(255, 255, 255); "></i></div></a>
<div  class="container">


   
   
    <div class="formulario">

        <div class="titulo-login">
        <i class="fa-solid fa-circle-user icone-login"></i>
        <strong>
            <h1>Vamos  criar  sua  conta!</h1>
        </strong>

        </div>

            <p class="frase">Os campos abaixo sao essenciais para criarmos a sua conta</p>
        <form action="cadastro_processo.php" method="post">


            <div class="caixa-formulario">
                <input type="text" placeholder="Nome completo" required name="nome">
                <i class="fa-solid fa-user icone-esquerda"></i>           

            </i>
            </div>

            <div class="caixa-formulario">
                <input type="text" placeholder="E-mail" required name="email">
            <i class="fa-solid fa-envelope icone-esquerda"></i>
            </div>

            <div class="caixa-formulario">
                <i class="fa-solid fa-lock icone-esquerda"></i>

                <input type="password" 
                placeholder="Senha" 
                id="senha" 
                required name="senha">

                <i class="fa-solid fa-eye-slash icone-direita" 
                id="toggleSenha">
            </i>
            </div>


            <div class="botao">
                <button type="submit">Criar conta</button>
           </div>

        </form>

        
</div>
    </div>

   <script>
const senha = document.getElementById("senha");
const olho = document.getElementById("toggleSenha");

olho.addEventListener("click", () => {
    if (senha.type === "password") {
        senha.type = "text"; // mostra a senha
        olho.classList.remove("fa-eye-slash");
        olho.classList.add("fa-eye");
    } else {
        senha.type = "password"; // esconde a senha
        olho.classList.remove("fa-eye");
        olho.classList.add("fa-eye-slash");
    }
});
</script>  
</body>
</html>
