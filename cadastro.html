<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSPORTS</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>
    <header class="cabecalho">


        <a href="#">
            <img src="logoIFsports.png" alt="Logo IFsports" height="70px" width="170px" class="logoIFsportsImg">
        </a>
    </header>
   
<div  class="container">


   
   
    <div class="formulario">

        <i class="fa-solid fa-circle-user"></i>
        <strong>
            <h1>Vamos  criar  sua  conta!</h1>
        </strong>

            <p class="frase">Os campos abaixo sao essenciais para criarmos a sua conta</p>
        <form action="#">


            <div class="caixa-formulario">
                <input type="text" placeholder="Nome completo" required name="nome">
                <i class="fa-solid fa-user icone-esquerda"></i>           

            </i>
            </div>

            <div class="caixa-formulario">
                <input type="text" placeholder="E-mail" required name="email">
            <i class="fa-solid fa-user icone-esquerda"></i>           
            </div>

            <div class="caixa-formulario">
                <i class="fa-solid fa-lock icone-esquerda"></i>

                <input type="password" 
                placeholder="Senha" 
                id="senha" 
                required name="senha">

                <i class="fa-solid fa-eye-slash icone-direita" 
                id="toggleSenha">
            </i>
            </div>


            <div class="botao">
                <button type="submit"><a href="login.html">Criar conta</a></button>
            </div>

        </form>
</div>
    </div>
</body>
</html>
