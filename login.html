<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSPORTS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="logoIFsports.png">
</head>
<body>
    <header class="cabecalho">

        <a href="#">
            <img src="logoIFsports.png" alt="Logo IFsports" height="70px" width="170px" class="logoIFsportsImg">
        </a>
    </header>
    
<div  class="container">
    
    <div class="formulario">
        <strong>
            <h1>Acesse sua conta</h1>
        </strong>
        <form action="#">

            <p class="coisa">Nome</p>
            <div class="caixa-formulario">
                <input type="text" placeholder="Nome de usuario" required>
            </div>
             <p class="coisa">Informe a senha</p>
            <div class="caixa-formulario">
                <input type="password" placeholder="Senha" required>
            </div>
          <div class="caixa-esqueci">
                <a href="#">Esqueci minha senha</a>
          </div>
            <button type="submit">Entrar</button>
            <div class="link-registro">
            <p>Não tem uma conta? <a href="#">Crie uma conta</a></p>
            </div>
        </form>
</div>
    </div>
</body>
</html>
