<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar senha</title>
    <link rel="stylesheet" href="CSS/redefinir_senha.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>

       <header class="cabecalho">


        <a href="#">
            <img src="logoIFsports.png" alt="Logo IFsports" height="70px" width="170px" class="logoIFsportsImg">
        </a>
    </header>

    <div class="container">
    <div class="formulario">
        <form action="#" method="post">

            <i class="fa-solid fa-lock icone-cadeado"></i>
            <h1>Mudar senha</h1>

            <p class="frase">Coloque uma senha que nao esqueça</p>

            <div class="nova-senha">
            <input type="password" 
            name="senha"
            placeholder="Informe a nova senha" required>
             <i class="fa-solid fa-lock icone-cadeado"></i>
            </div>

            <div class="confirmar-senha">
            <input type="password" 
            name="senha2"
            placeholder="Cofirme a nova senha" required>
             <i class="fa-solid fa-lock icone-cadeado"></i>
            </div>

            <button type="submit">Voltar e logar</button>

        </form>
    </div>
    </div>
</body>
</html>
